name: tauri-release-windows

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc,i686-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare production build
        shell: powershell
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)) {
            throw "TAURI_UPDATER_PUBLIC_KEY is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required"
          }

          Copy-Item "src-tauri/config.example.toml" "src-tauri/config.production.toml" -Force

      - name: Read annotated tag notes
        id: release_notes
        shell: powershell
        run: |
          $notes = git for-each-ref --format='%(contents)' "refs/tags/${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "See the assets below to download this version."
          }
          "body<<SIMPRINT_RELEASE_NOTES" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $notes | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "SIMPRINT_RELEASE_NOTES" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Prepare x64 fixed-runtime config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node deploy/prepare-tauri-config.mjs fixed-runtime x86_64-pc-windows-msvc
          node deploy/prepare-version.mjs

      - name: Publish x64 fixed-runtime installer and create release
        id: release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_NAME: production
          SIMPRINT_WEBVIEW_MODE: fixed-runtime
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: Simprint_[version]_[arch]_fixed-runtime[setup].[ext]
          args: --features production --target x86_64-pc-windows-msvc

      - name: Prepare ARM64 fixed-runtime config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node deploy/prepare-tauri-config.mjs fixed-runtime aarch64-pc-windows-msvc
          node deploy/prepare-version.mjs

      - name: Publish ARM64 fixed-runtime installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_NAME: production
          SIMPRINT_WEBVIEW_MODE: fixed-runtime
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: .
          releaseId: ${{ steps.release.outputs.releaseId }}
          tagName: ${{ github.ref_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: Simprint_[version]_[arch]_fixed-runtime[setup].[ext]
          args: --features production --target aarch64-pc-windows-msvc

      - name: Prepare x86 fixed-runtime config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node deploy/prepare-tauri-config.mjs fixed-runtime i686-pc-windows-msvc
          node deploy/prepare-version.mjs

      - name: Publish x86 fixed-runtime installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_NAME: production
          SIMPRINT_WEBVIEW_MODE: fixed-runtime
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: .
          releaseId: ${{ steps.release.outputs.releaseId }}
          tagName: ${{ github.ref_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: Simprint_[version]_[arch]_fixed-runtime[setup].[ext]
          args: --features production --target i686-pc-windows-msvc

      - name: Preserve fixed-runtime updater manifest
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifestDir = Join-Path $env:RUNNER_TEMP "simprint-fixed-updater-manifest"
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          gh release download "${{ github.ref_name }}" --pattern "latest.json" --dir $manifestDir

          $latestPath = Join-Path $manifestDir "latest.json"
          $fixedPath = Join-Path $manifestDir "latest-fixed.json"
          $releaseMetadataPath = Join-Path $manifestDir "release.json"
          gh api "repos/${{ github.repository }}/releases/${{ steps.release.outputs.releaseId }}" |
            Out-File -FilePath $releaseMetadataPath -Encoding utf8
          node deploy/verify-updater-manifest.mjs $latestPath fixed-runtime $releaseMetadataPath
          Copy-Item $latestPath $fixedPath
          gh release upload "${{ github.ref_name }}" $fixedPath --clobber

      - name: Prepare x64 embedBootstrapper config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node deploy/prepare-tauri-config.mjs embedBootstrapper x86_64-pc-windows-msvc
          node deploy/prepare-version.mjs

      - name: Publish x64 embedBootstrapper installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_NAME: production
          SIMPRINT_WEBVIEW_MODE: embedBootstrapper
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: .
          releaseId: ${{ steps.release.outputs.releaseId }}
          tagName: ${{ github.ref_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: Simprint_[version]_[arch]_embedBootstrapper[setup].[ext]
          args: --features production --target x86_64-pc-windows-msvc

      - name: Prepare ARM64 embedBootstrapper config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node deploy/prepare-tauri-config.mjs embedBootstrapper aarch64-pc-windows-msvc
          node deploy/prepare-version.mjs

      - name: Publish ARM64 embedBootstrapper installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_NAME: production
          SIMPRINT_WEBVIEW_MODE: embedBootstrapper
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: .
          releaseId: ${{ steps.release.outputs.releaseId }}
          tagName: ${{ github.ref_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: Simprint_[version]_[arch]_embedBootstrapper[setup].[ext]
          args: --features production --target aarch64-pc-windows-msvc

      - name: Prepare x86 embedBootstrapper config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node deploy/prepare-tauri-config.mjs embedBootstrapper i686-pc-windows-msvc
          node deploy/prepare-version.mjs

      - name: Publish x86 embedBootstrapper installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_NAME: production
          SIMPRINT_WEBVIEW_MODE: embedBootstrapper
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: .
          releaseId: ${{ steps.release.outputs.releaseId }}
          tagName: ${{ github.ref_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: Simprint_[version]_[arch]_embedBootstrapper[setup].[ext]
          args: --features production --target i686-pc-windows-msvc

      - name: Verify both updater manifests
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifestDir = Join-Path $env:RUNNER_TEMP "simprint-final-updater-manifests"
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          gh release download "${{ github.ref_name }}" --pattern "latest.json" --dir $manifestDir
          gh release download "${{ github.ref_name }}" --pattern "latest-fixed.json" --dir $manifestDir

          $releaseMetadataPath = Join-Path $manifestDir "release.json"
          gh api "repos/${{ github.repository }}/releases/${{ steps.release.outputs.releaseId }}" |
            Out-File -FilePath $releaseMetadataPath -Encoding utf8
          node deploy/verify-updater-manifest.mjs (Join-Path $manifestDir "latest.json") embedBootstrapper $releaseMetadataPath
          node deploy/verify-updater-manifest.mjs (Join-Path $manifestDir "latest-fixed.json") fixed-runtime $releaseMetadataPath

      - name: Publish completed GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
