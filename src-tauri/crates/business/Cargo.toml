[package]
name = "business"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "business"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
] }
serde = { version = "^1.0.217", features = ["derive"] }
serde_json = "^1"
thiserror = "2"
anyhow = "1.0.93"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
jwt = "0.16.0"
argon2 = "0.5.3"
aes-gcm = "0.10.3"
sha2 = "0.10.8"
hmac = "0.12.1"
hex = "0.4"
config = "0.15"
tracing = "0.1"
sqlx = { version = "0.8", features = [
    "sqlite",
    "postgres",
    "runtime-tokio",
    "chrono",
    "json",
    "uuid",
    "rust_decimal",
] }
uuid = { version = "1.11.0", features = [
    "v4",
    "fast-rng",
    "macro-diagnostics",
    "serde",
] }
lettre = "0.11"
dashmap = "6.1.0"
url = "2.5.4"
rust_decimal = { version = "1.39.0", features = [
    "serde-with-str",
    "db-postgres",
] }
